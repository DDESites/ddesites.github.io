<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-label="Composição com telas de site em computador e celular, gráfico de crescimento e cartões de contato">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75C9E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#149ED0" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="faixaSite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063B55"/>
      <stop offset="1" stop-color="#0A5877"/>
    </linearGradient>
    <linearGradient id="celular" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF7FB"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#28B7A4"/>
      <stop offset="1" stop-color="#75C9E8"/>
    </linearGradient>
    <pattern id="pontos" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#063B55" opacity="0.22"/>
    </pattern>
    <filter id="sombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#063B55" flood-opacity="0.18"/>
    </filter>
    <filter id="sombraLeve" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#063B55" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <circle cx="352" cy="300" r="268" fill="url(#fundo)"/>
  <circle cx="352" cy="300" r="268" fill="url(#pontos)"/>
  <circle cx="120" cy="120" r="46" fill="#F5A623" opacity="0.22"/>
  <circle cx="640" cy="520" r="60" fill="#28B7A4" opacity="0.2"/>

  <!-- Navegador -->
  <g filter="url(#sombra)">
    <rect x="58" y="86" width="470" height="336" rx="20" fill="#FFFFFF"/>
    <path d="M58 106a20 20 0 0 1 20-20h430a20 20 0 0 1 20 20v24H58z" fill="#EAF4F9"/>
    <circle cx="84" cy="110" r="6" fill="#F5A623"/>
    <circle cx="104" cy="110" r="6" fill="#28B7A4"/>
    <circle cx="124" cy="110" r="6" fill="#149ED0"/>
    <rect x="152" y="102" width="300" height="16" rx="8" fill="#FFFFFF"/>
    <rect x="164" y="106" width="120" height="8" rx="4" fill="#9FC3D4"/>

    <!-- topo do site -->
    <rect x="58" y="130" width="470" height="42" fill="#FFFFFF"/>
    <rect x="82" y="144" width="86" height="14" rx="7" fill="#063B55"/>
    <rect x="300" y="146" width="42" height="10" rx="5" fill="#9FC3D4"/>
    <rect x="352" y="146" width="42" height="10" rx="5" fill="#9FC3D4"/>
    <rect x="404" y="146" width="42" height="10" rx="5" fill="#9FC3D4"/>
    <rect x="458" y="140" width="52" height="22" rx="11" fill="#F5A623"/>

    <!-- banner principal -->
    <rect x="58" y="172" width="470" height="118" fill="url(#faixaSite)"/>
    <rect x="84" y="196" width="230" height="16" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <rect x="84" y="220" width="180" height="16" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <rect x="84" y="246" width="140" height="10" rx="5" fill="#75C9E8" opacity="0.9"/>
    <rect x="84" y="264" width="86" height="16" rx="8" fill="#F5A623"/>
    <rect x="360" y="192" width="140" height="78" rx="10" fill="#149ED0" opacity="0.55"/>
    <circle cx="404" cy="228" r="18" fill="#FFFFFF" opacity="0.5"/>
    <path d="M392 250l16-16 12 10 14-16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- cartões -->
    <g filter="url(#sombraLeve)">
      <rect x="84" y="306" width="132" height="86" rx="12" fill="#F4F8FA"/>
      <rect x="234" y="306" width="132" height="86" rx="12" fill="#F4F8FA"/>
      <rect x="384" y="306" width="118" height="86" rx="12" fill="#F4F8FA"/>
    </g>
    <circle cx="108" cy="330" r="12" fill="#149ED0" opacity="0.75"/>
    <rect x="100" y="354" width="88" height="9" rx="4.5" fill="#063B55" opacity="0.75"/>
    <rect x="100" y="370" width="66" height="8" rx="4" fill="#9FC3D4"/>
    <circle cx="258" cy="330" r="12" fill="#28B7A4" opacity="0.85"/>
    <rect x="250" y="354" width="88" height="9" rx="4.5" fill="#063B55" opacity="0.75"/>
    <rect x="250" y="370" width="66" height="8" rx="4" fill="#9FC3D4"/>
    <circle cx="408" cy="330" r="12" fill="#F5A623" opacity="0.9"/>
    <rect x="400" y="354" width="76" height="9" rx="4.5" fill="#063B55" opacity="0.75"/>
    <rect x="400" y="370" width="56" height="8" rx="4" fill="#9FC3D4"/>
  </g>

  <!-- Cartão de crescimento -->
  <g filter="url(#sombra)">
    <rect x="404" y="44" width="252" height="152" rx="18" fill="#FFFFFF"/>
    <rect x="426" y="66" width="118" height="12" rx="6" fill="#063B55"/>
    <rect x="426" y="86" width="78" height="9" rx="4.5" fill="#9FC3D4"/>
    <g>
      <rect x="426" y="126" width="24" height="46" rx="6" fill="url(#barra)" opacity="0.55"/>
      <rect x="462" y="112" width="24" height="60" rx="6" fill="url(#barra)" opacity="0.7"/>
      <rect x="498" y="96" width="24" height="76" rx="6" fill="url(#barra)" opacity="0.85"/>
      <rect x="534" y="80" width="24" height="92" rx="6" fill="url(#barra)"/>
    </g>
    <path d="M580 148l18-20 16 12 20-30" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="634" cy="110" r="6" fill="#F5A623"/>
  </g>

  <!-- Celular -->
  <g filter="url(#sombra)">
    <rect x="470" y="238" width="184" height="330" rx="30" fill="#063B55"/>
    <rect x="480" y="248" width="164" height="310" rx="22" fill="url(#celular)"/>
    <rect x="530" y="256" width="64" height="8" rx="4" fill="#063B55" opacity="0.35"/>
    <rect x="494" y="278" width="136" height="86" rx="12" fill="url(#faixaSite)"/>
    <rect x="506" y="296" width="84" height="10" rx="5" fill="#FFFFFF" opacity="0.95"/>
    <rect x="506" y="312" width="62" height="10" rx="5" fill="#FFFFFF" opacity="0.95"/>
    <rect x="506" y="334" width="54" height="14" rx="7" fill="#F5A623"/>
    <rect x="494" y="378" width="136" height="14" rx="7" fill="#063B55" opacity="0.8"/>
    <rect x="494" y="402" width="112" height="9" rx="4.5" fill="#9FC3D4"/>
    <rect x="494" y="418" width="124" height="9" rx="4.5" fill="#9FC3D4"/>
    <rect x="494" y="446" width="64" height="64" rx="12" fill="#EAF4F9"/>
    <rect x="566" y="446" width="64" height="64" rx="12" fill="#EAF4F9"/>
    <circle cx="526" cy="472" r="14" fill="#149ED0" opacity="0.6"/>
    <circle cx="598" cy="472" r="14" fill="#28B7A4" opacity="0.7"/>
    <rect x="494" y="524" width="136" height="24" rx="12" fill="#F5A623"/>
  </g>

  <!-- Cartão de contato -->
  <g filter="url(#sombraLeve)">
    <rect x="46" y="452" width="216" height="96" rx="16" fill="#FFFFFF"/>
    <circle cx="86" cy="500" r="24" fill="#28B7A4" opacity="0.18"/>
    <path d="M78 492h16v12a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z" fill="none" stroke="#1C9484" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M78 492l8 7 8-7" fill="none" stroke="#1C9484" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="122" y="484" width="116" height="11" rx="5.5" fill="#063B55"/>
    <rect x="122" y="503" width="90" height="9" rx="4.5" fill="#9FC3D4"/>
    <rect x="122" y="520" width="66" height="9" rx="4.5" fill="#28B7A4" opacity="0.6"/>
  </g>

  <!-- Cursor -->
  <g filter="url(#sombraLeve)">
    <path d="M282 470l44 16-17 6-6 17z" fill="#063B55"/>
    <path d="M282 470l44 16-17 6-6 17z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <rect x="322" y="500" width="96" height="30" rx="15" fill="#F5A623"/>
    <rect x="336" y="511" width="68" height="8" rx="4" fill="#063B55" opacity="0.8"/>
  </g>
</svg>
